name: applications

services:
  # ---------------------------------------------------------------------------
  # NestJS Backend API
  # ---------------------------------------------------------------------------
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uvd_app_server
    restart: unless-stopped
    ports:
      - '127.0.0.1:${BACKEND_EXTERNAL_PORT:-3001}:3000'
    volumes:
      - ./templates:/usr/src/app/templates
    environment:
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Ma'lumotlar bazasi sozlamalari
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      - DB_NAME=${DB_NAME:-uvd_app_db}
      - DB_SYNCHRONIZE=${DB_SYNCHRONIZE:-false}
      # Redis sozlamalari
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
      # MinIO (Fayllar xotirasi) sozlamalari
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD environment variable is required}
      # JWT sozlamalari
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET environment variable is required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET environment variable is required}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      # ONLYOFFICE JWT sozlamalari
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET environment variable is required}
      - ONLYOFFICE_INTERNAL_URL=${ONLYOFFICE_INTERNAL_URL:-http://uvd_app_onlyoffice}
      # CrowdSec LAPI integratsiyasi
      - CROWDSEC_LAPI_URL=${CROWDSEC_LAPI_URL:-http://uvd_app_crowdsec:8080}
      - CROWDSEC_LAPI_KEY=${CROWDSEC_LAPI_KEY:-}
      # Super Admin sozlamalari (seed)
      - SUPER_ADMIN_USERNAME=${SUPER_ADMIN_USERNAME:-admin}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?SUPER_ADMIN_PASSWORD environment variable is required}
      - SUPER_ADMIN_FIRST_NAME=${SUPER_ADMIN_FIRST_NAME:-Admin}
      - SUPER_ADMIN_LAST_NAME=${SUPER_ADMIN_LAST_NAME:-Boshqaruvchi}
      - SUPER_ADMIN_PHONE=${SUPER_ADMIN_PHONE:-+998901234567}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - uvd_app_network

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: uvd_app_postgres
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DB_EXTERNAL_PORT:-5436}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD environment variable is required}
      POSTGRES_DB: ${DB_NAME:-uvd_app_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-uvd_app_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uvd_app_network

  # ---------------------------------------------------------------------------
  # Redis Cache & Session Store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: uvd_app_redis
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}']
    ports:
      - '127.0.0.1:${REDIS_EXTERNAL_PORT:-6383}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping']
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD environment variable is required}
    networks:
      - uvd_app_network

  # ---------------------------------------------------------------------------
  # MinIO S3 Object Storage
  # ---------------------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: uvd_app_minio
    user: '0:0'
    restart: unless-stopped
    entrypoint: minio
    command: server /data --console-address ":9001"
    ports:
      - '127.0.0.1:${MINIO_EXTERNAL_PORT:-9200}:9000' # MinIO S3 API (faqat localhost)
      - '127.0.0.1:${MINIO_CONSOLE_EXTERNAL_PORT:-9201}:9001' # Web Console UI (faqat localhost)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD environment variable is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - uvd_app_network

  # ---------------------------------------------------------------------------
  # ONLYOFFICE Document Server
  # ---------------------------------------------------------------------------
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: uvd_app_onlyoffice
    restart: unless-stopped
    ports:
      - '${ONLYOFFICE_PORT:-8084}:80'
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET environment variable is required}
      - JWT_HEADER=Authorization
      - ALLOW_PRIVATE_IP_ADDRESS=true
    networks:
      - uvd_app_network

  # ---------------------------------------------------------------------------
  # CrowdSec Intrusion Detection & Traffic Security Engine
  # ---------------------------------------------------------------------------
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: uvd_app_crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios
      - GID=1000
      - BOUNCER_KEY_UVD_DASHBOARD=${CROWDSEC_LAPI_KEY:-}
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - /var/log/nginx:/var/log/nginx:ro
      - crowdsec_db:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    networks:
      - uvd_app_network

volumes:
  postgres_data:
    name: uvd_app_postgres_data
  redis_data:
    name: uvd_app_redis_data
  minio_data:
    name: uvd_app_minio_data
  crowdsec_db:
    name: uvd_app_crowdsec_db
  crowdsec_config:
    name: uvd_app_crowdsec_config

networks:
  uvd_app_network:
    name: uvd_app_network
    driver: bridge
